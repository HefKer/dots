# herdr/plugins/agent-focus: the sidebar and agent keys keep to this space, plus
# agents waiting on you elsewhere.
[[keys.command]]
key = "prefix+v"
type = "plugin_action"
command = "hefker.agent-focus.toggle"

[[keys.command]]
key = "prefix+d"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.review"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.review:staged"

[[keys.command]]
key = "prefix+shift+b"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.review:branch"

[[keys.command]]
key = "prefix+shift+c"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.review:commit"

[[keys.command]]
key = "prefix+shift+s"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.send-review"

[[keys.command]]
key = "prefix+n"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.next-comment"

[[keys.command]]
key = "prefix+p"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.prev-comment"

# smart-splits-backend-herdr: ctrl+hjkl goes into nvim when it's the pane's
# foreground program, otherwise moves herdr focus, and falls back to the pane
# when there is no neighbour (so ctrl+l still clears a shell at an edge).
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "smart-splits-backend-herdr.left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "smart-splits-backend-herdr.down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "smart-splits-backend-herdr.up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "smart-splits-backend-herdr.right"

[[keys.command]]
key = "prefix+y"
type = "plugin_action"
command = "ray.file-explorer.open"

[[keys.command]]
key = "prefix+shift+y"
type = "plugin_action"
command = "ray.file-explorer.open-tab"

[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "herdr-floax.toggle"

[[keys.command]]
key = "prefix+i"
type = "plugin_action"
command = "herdr-floax.instances"

[[keys.command]]
key = "prefix+g"
type = "plugin_action"
command = "herdr-lazygit.open"

[[keys.command]]
key = "prefix+shift+g"
type = "plugin_action"
command = "herdr-lazygit.open-tab"
