onboarding = false
[theme]
name = "terminal"
auto_switch = false

[terminal]
default_shell = "fish"
new_cwd = "follow"

[session]
resume_agents_on_restore = true

[ui]
# herdr-auto-title names new tabs; a name typed at the prompt would count as manual and pin it.
prompt_new_tab_name = false
# Claude's account-wide 5h and weekly usage and time to reset, from scripts/claude-limits.
tab_bar_right = [
  { type = "command", command = "$HOME/dots/scripts/claude-limits", interval_seconds = 30, timeout_seconds = 2 },
]

# herdr-auto-title reports what each workspace's active tab is doing as $topic.
[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace", "branch", "git_status"],
  [{ token = "$topic", bold = true, dim = false }],
]

# The default agent rows, plus Claude's context use, reported by ~/.claude/statusline.sh.
[ui.sidebar.agents]
rows = [
  ["state_icon", "machine", "workspace", "tab"],
  ["agent", { token = "$ctx", dim = true }],
]

[keys]
prefix = "ctrl+space"
goto = "prefix+space"
new_tab = "prefix+t"
split_vertical = "prefix+\\"
split_horizontal = "prefix+minus"
copy_mode = "prefix+c"
navigate_workspace_up = "k"
navigate_workspace_down = "j"
previous_tab = ["prefix+shift+h", "ctrl+shift+h"]
next_tab = ["prefix+shift+l", "ctrl+shift+l"]
previous_workspace = ["prefix+shift+k", "ctrl+shift+k"]
next_workspace = ["prefix+shift+j", "ctrl+shift+j"]
# Taken by scripts/herdr-agent-cycle below, which lands on a tab's prompt pane.
previous_agent = []
next_agent = []
focus_agent = []
switch_tab = ["prefix+1..9", "ctrl+1..9"]
switch_workspace = "ctrl+shift+1..9"
# Unused, and its default prefix+shift+g takes priority over herdr-lazygit's open-tab.
new_worktree = []

[[keys.command]]
key = "prefix+a"
type = "shell"
command = "$HOME/dots/scripts/claude-prompt"

# next_agent/previous_agent/focus_agent, but focusing the agent's prompt pane when its
# tab has one; prefix+alt+a/ctrl+alt+a walk agents waiting on you: blocked, done, idle, newest first.
[[keys.command]]
key = "prefix+alt+j"
type = "shell"
command = "$HOME/dots/scripts/herdr-agent-cycle next"

[[keys.command]]
key = "ctrl+alt+j"
type = "shell"
command = "$HOME/dots/scripts/herdr-agent-cycle next"

[[keys.command]]
key = "prefix+alt+k"
type = "shell"
command = "$HOME/dots/scripts/herdr-agent-cycle prev"

[[keys.command]]
key = "ctrl+alt+k"
type = "shell"
command = "$HOME/dots/scripts/herdr-agent-cycle prev"

