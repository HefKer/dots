# keymap-drawer config for the kanata keymap viewer (Mod+/), keyed on keymap.kbd's alias names.
# Its kanata parser can't read deftemplate/t! or switch, so those aliases get their legends here.
parse_config:
  raw_binding_map:
    "@hra": {t: A, h: Gui}
    "@hrs": {t: S, h: Alt}
    "@hrd": {t: D, h: Ctrl}
    "@hrf": {t: F, h: Shift}
    "@hrj": {t: J, h: Shift}
    "@hrk": {t: K, h: Ctrl}
    "@hrl": {t: L, h: Alt}
    "@hr;": {t: ";", h: Gui}
    "@esc": {t: Esc, s: "⇧+⇧: passthru"}
    "@fnl": {t: Fn Lock}
