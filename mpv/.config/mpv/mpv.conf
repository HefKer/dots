script-opts=ytdl_hook-ytdl_path=yt-dlp
ytdl-format=bestvideo[height<=?1080][vcodec!^=av01]+bestaudio/best
ytdl-raw-options=write-subs=,write-auto-subs=,sub-langs=en.*,extractor-args=youtube:skip=hls
sub-auto=fuzzy
sub-font="Inter"
sub-bold=yes
slang=en,eng
sid=auto
sub-font-size=40
sub-border-size=2
sub-shadow-offset=2
sub-shadow-color="#80000000"

# playback
save-position-on-quit=yes
keep-open=yes
# open a file and its folder's other videos and audio become the playlist
autocreate-playlist=filter
directory-filter-types=video,audio
force-window=immediate
hwdec=auto-safe
profile=high-quality
video-sync=display-resample
# trial: interpolation=no to turn off
interpolation=yes
osd-duration=2000
osd-font=Inter
