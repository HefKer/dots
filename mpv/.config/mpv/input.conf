k add volume 5
j add volume -5
h seek -5
l seek 5
H add chapter -1
L add chapter 1
# source URL: the comment tag yt-dlp's --add-metadata writes into downloads, else the stream's own URL
ctrl+u show-text "${?metadata/by-key/comment:${metadata/by-key/comment}}${!metadata/by-key/comment:${path}}" 5000
ctrl+U run sh -c "xdg-open \"$1\"" _ "${?metadata/by-key/comment:${metadata/by-key/comment}}${!metadata/by-key/comment:${path}}"

# g: mpv's select group. sponsorblock's g/G (mark and submit a segment) would swallow the prefix
g ignore
G ignore
g-m script-binding uosc/menu
g-h script-binding memo-history
g-g script-binding select/select-binding
g-b ignore
