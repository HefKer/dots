# The desktop leader, Mod+Ctrl+Space: herdr's prefix (Ctrl+Space) raised one scope by
# adding Mod. It holds rare desktop actions, and app actions reachable over the app's
# IPC (qutebrowser's :commands, `dms ipc`). Groups use LazyVim's letters (ADR 0002);
# the rung each action earns is in docs/agents/binds.md. The bind palette (s k) reads
# this file as one more scope, so a leaf's desc is what search finds.

font: monospace 13
background: "#2d353bf0"
color: "#d3c6aa"
border: "#a7c080"
separator: "  "
border_width: 2
corner_r: 10
rows_per_column: 8
column_padding: 30
anchor: center
inhibit_compositor_keyboard_shortcuts: true
auto_kbd_layout: true

menu:
  # Space: the leader's most-used picker, as LazyVim's <leader><space>.
  - key: space
    desc: Search binds (bind palette)
    cmd: bind-palette

  - key: s
    desc: +search
    submenu:
      - key: k
        desc: Keymaps (bind palette)
        cmd: bind-palette

  - key: w
    desc: +windows
    submenu:
      - key: p
        desc: Pick a window
        cmd: window-pick
      - key: m
        desc: Maximize the column
        cmd: niri msg action maximize-column
      - key: f
        desc: Expand the column to the free width
        cmd: niri msg action expand-column-to-available-width
      - key: h
        desc: Reset the window height
        cmd: niri msg action reset-window-height
      - key: r
        desc: Create a window rule
        cmd: dms ipc call window-rules toggle
      - key: n
        desc: Rename the workspace
        cmd: dms ipc call workspace-rename open
      - key: t
        desc: Float or tile the window
        cmd: niri msg action toggle-window-floating
      - key: v
        desc: Focus between floating and tiling
        cmd: niri msg action switch-focus-between-floating-and-tiling
      # keep_open: press again to keep moving
      - key: u
        desc: Move the workspace down
        cmd: niri msg action move-workspace-down
        keep_open: true
      - key: i
        desc: Move the workspace up
        cmd: niri msg action move-workspace-up
        keep_open: true

  - key: n
    desc: +notes
    submenu:
      - key: n
        desc: Notification history
        cmd: dms ipc call notifications toggle
      - key: p
        desc: Notepad
        cmd: dms ipc call notepad toggle

  # Print: the rare captures; Print (copy a region) and Mod+Print (edit one) stay combos.
  - key: p
    desc: +print
    submenu:
      - key: w
        desc: Edit a window screenshot
        cmd: dms ipc call quickCapture screenshot window edit
      - key: s
        desc: Edit a screen screenshot
        cmd: dms ipc call quickCapture screenshot full edit
      - key: r
        desc: Record a region (GIF)
        cmd: dms ipc call quickCapture recordToggle region
      - key: R
        desc: Record the screen (GIF)
        cmd: dms ipc call quickCapture recordToggle screen
      - key: c
        desc: Pick a color
        cmd: dms ipc call color-picker toggle

  # Memes and sounds (from the nixos flake's memes package); Quick Capture saves
  # recordings to ~/Videos/Recordings, its default recordingDirectory.
  - key: m
    desc: +memes
    submenu:
      - key: a
        desc: Save the copied meme
        cmd: meme-add
      - key: b
        desc: Browse memes
        cmd: wezterm start --class yazi -- yazi ~/memes
      - key: s
        desc: Play a sound (into the Soundboard mic and to you)
        cmd: sound-pick
      - key: S
        desc: Save the copied sound
        cmd: sound-add
      - key: x
        desc: Stop the sound
        cmd: sound-stop
      - key: r
        desc: Browse recordings
        cmd: wezterm start --class yazi -- yazi ~/Videos/Recordings

  # Casting points niri's Dynamic Cast Target (pick it once in the screenshare dialog),
  # so it shows nothing unless a cast is live; each entry says what it did.
  - key: o
    desc: +outputs
    submenu:
      - key: r
        desc: Cast the right screen
        cmd: >-
          niri msg action set-dynamic-cast-monitor DP-3
          && notify-send -a niri "Casting: right screen"
      - key: o
        desc: Cast osu
        cmd: >-
          id="$(niri msg --json windows
          | jq -r 'map(select(.app_id | test("^osu"; "i"))) | first | .id // empty')";
          if [ -n "$id" ]; then niri msg action set-dynamic-cast-window --id "$id"
          && notify-send -a niri "Casting: osu"; else notify-send -a niri "osu isn't open"; fi
      - key: x
        desc: Stop casting
        cmd: >-
          niri msg action clear-dynamic-cast-target
          && notify-send -a niri "Casting: nothing"
      - key: p
        desc: Turn the monitors off
        cmd: niri msg action power-off-monitors

  - key: u
    desc: +ui
    submenu:
      - key: n
        desc: Do Not Disturb
        cmd: dms ipc call notifications toggleDoNotDisturb
      - key: w
        desc: Browse wallpapers
        cmd: dms ipc call dankdash wallpaper
      - key: l
        desc: Night light
        cmd: dms ipc call night toggle
      - key: i
        desc: Keep awake
        cmd: dms ipc call inhibit toggle
      - key: b
        desc: Hide or show the bar
        cmd: dms ipc call bar toggle index 0
      - key: t
        desc: Light or dark theme
        cmd: dms ipc call theme toggle
      - key: p
        desc: Power profile
        cmd: dms ipc call powerprofile toggle

  - key: q
    desc: +session
    submenu:
      - key: l
        desc: Lock the screen
        cmd: dms ipc call lock lock
      - key: d
        desc: Restart Vesktop
        cmd: >-
          pkill -f 'Vesktop/resources/app.asar';
          while pgrep -f 'Vesktop/resources/app.asar' >/dev/null; do sleep 0.2; done;
          vesktop
      - key: q
        desc: Quit niri
        cmd: niri msg action quit
